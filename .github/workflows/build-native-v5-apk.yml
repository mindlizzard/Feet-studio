name: Build Feet Studio v5.6.3 Native APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "native-v5/**"
      - ".github/workflows/build-native-v5-apk.yml"

permissions:
  contents: read

concurrency:
  group: feet-studio-v5-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build native APK
        working-directory: native-v5
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p release
          cp native-v5/app/build/outputs/apk/debug/app-debug.apk release/Feet-Studio-v5.6.3-Native-debug.apk

      - name: Upload native APK
        uses: actions/upload-artifact@v4
        with:
          name: Feet-Studio-v5.6.3-Native-APK
          path: release/Feet-Studio-v5.6.3-Native-debug.apk
          if-no-files-found: error
          retention-days: 30
